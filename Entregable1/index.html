<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Práctico Entregable N°1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #181B1D;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 12px;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 50px;
            text-align: center;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 500px;
            max-width: 90%;
        }

        .boton {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;

            padding: 16px 30px;
            border-radius: 10px;

            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .boton:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .editor {
            background-color: #F7C544;
            color: #181B1D;
        }

        .presentacion {
            background-color: #8A38F5;
        }
    </style>
</head>

<body>

            Modo Presentación
        </a>

    </div>

</body>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game.House | Log in</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/log-in.css">
    <link rel="stylesheet" href="css/site-links.css">
    <script type="module" src="js/form-validation.js"></script>
</head>

<body class="login">

    <main>
        <div class="c1">
            <div class="logo-c">

                <a class="site-link" href=" " id="logo">
                    <img src="img/Logo.svg" alt="inicio">
                </a>
                
            </div>

            <div class="c2">
                <div class="forms" id="ingreso">
                    
                    <p class="t1">Hola de nuevo!</p>

                    <div class="inputs">
                        <form action="index.html" data-validate-required novalidate>
                            <label for="email">Correo electrónico <span class="required-indicator" aria-hidden="true">*</span></label>
                            <input type="email" id="email" name="email" placeholder="tuemail@gmail.com" aria-describedby="email-error" required>
                            <span class="field-error" id="email-error" aria-live="polite" hidden></span>

                            <label for="password">Contraseña <span class="required-indicator" aria-hidden="true">*</span></label>
                            <input type="password" id="password" placeholder="*********" name="password" aria-describedby="password-error" required>
                            <span class="field-error" id="password-error" aria-live="polite" hidden></span>

                            <a class="forgot-password site-link" href=" ">¿Olvidaste tu contraseña?</a>

                            <button class="amarillo" type="submit">INICIAR SESION</button>
                        </form>
                    </div>

                    <p>o ingresa con</p>

                    <!-- Botones de redes sociales -->
                    <div class="social-login">

                        <button class="social-btn" type="button">
                            <img src="img/google-icon.svg" alt="Google" class="social-icon">
                            <span class="social-text">Continuar con Google</span>
                        </button>

                        <button class="social-btn" type="button">
                            <img src="img/phone-icon.svg" alt="Teléfono" class="social-icon">
                            <span class="social-text">Continuar con número de teléfono</span>
                        </button>

                        <button class="social-btn" type="button">
                            <img src="img/facebook-icon.svg" alt="Facebook" class="social-icon">
                            <span class="social-text">Continuar con Facebook</span>
                        </button>
                        
                        <button class="social-btn" type="button">
                            <img src="img/apple-icon.svg" alt="Apple" class="social-icon">
                            <span class="social-text">Continuar con Apple</span>
                        </button>
                    </div>

                    <p class="body"><a class="site-link" href="registro.html"><span class="link">Crear una cuenta nueva</span></a></p>
                
                </div>
            </div>

            <div class="c2">
                
            </div>
        </div>
    </main>

</body>
</html>

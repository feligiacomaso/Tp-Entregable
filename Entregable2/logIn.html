<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game.House | Log in</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/log-in.css">
</head>

<body class="login">

    <main>
        <div class="c1">
            <div class="logo-c">

                <a href="index.html" id="logo">
                    <img src="img/Logo.svg" alt="inicio">
                </a>
                
            </div>

            <div class="c2">
                <div class="forms" id="ingreso">
                    
                    <p class="t1">Hola de nuevo!</p>

                    <div class="inputs">
                        <form>
                            <label for="email">Correo electrónico <span style="color: red;">*</span></label>
                            <input type="email" id="email" name="email" placeholder="jimartinezabadias@gmail.com" required>

                            <label for="password">Contraseña <span style="color: red;">*</span></label>
                            <input type="password" id="password" placeholder="12345" name="password">

                            <button class="amarillo" type="submit">INGRESAR</button>
                        </form>
                    </div>

                    <p>o ingresa con</p>

                    <!-- Botones de redes sociales -->
                    <div class="social-login">

                        <button class="social-btn" type="button">
                            <img src="img/google-icon.svg" alt="Google" class="social-icon">
                            <span class="social-text">Continuar con Google</span>
                        </button>

                        <button class="social-btn" type="button">
                            <img src="img/phone-icon.svg" alt="Teléfono" class="social-icon">
                            <span class="social-text">Continuar con número de teléfono</span>
                        </button>

                        <button class="social-btn" type="button">
                            <img src="img/facebook-icon.svg" alt="Facebook" class="social-icon">
                            <span class="social-text">Continuar con Facebook</span>
                        </button>
                        
                        <button class="social-btn" type="button">
                            <img src="img/apple-icon.svg" alt="Apple" class="social-icon">
                            <span class="social-text">Continuar con Apple</span>
                        </button>
                    </div>

                    <p class="body">No tenes una cuenta? <a href="registro.html"><span class="link">Registrate</span></a></p>
                
                </div>
            </div>

            <div class="c2">
                
            </div>
        </div>
    </main>

</body>
</html>

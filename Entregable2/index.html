<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Game House | Juegos</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/header-panels.css">
        <link rel="stylesheet" href="css/game-card.css">
        <link rel="stylesheet" href="css/banner-carousel.css">
        <link rel="stylesheet" href="css/game-carousels.css">
        <link rel="stylesheet" href="css/game-details.css">
        <link rel="stylesheet" href="css/footer.css">
        <script type="module" src="js/main.js"></script>
    </head>
    <body>
        <iframe class="header-frame" src="header.html" title="Encabezado de Game House"></iframe>
        <main>
            <section class="featured" aria-label="Juegos destacados">
                <div class="section-title">
                    <div>
                        <p class="featured-title">Juegos destacados</p>
                    </div>
                </div>
                <div class="carousel hero">
                    <button class="arrow hero-arrow hero-prev" aria-label="Anterior"></button>
                    <div class="track"></div>
                    <button class="arrow hero-arrow hero-next" aria-label="Siguiente"></button>
                </div>
            </section>
            <section class="game-section">
                <div class="section-title">
                    <h2>Recomendados para vos</h2>
                </div>
                <div class="carousel">
                    <button class="arrow row-arrow row-prev" aria-label="Anterior"></button>
                    <div class="track"></div>
                    <button class="arrow row-arrow row-next" aria-label="Siguiente"></button>
                </div>
            </section>
            <section class="game-section">
                <div class="section-title">
                    <h2>Porque jugaste al Call of Duty</h2>
                </div>
                <div class="carousel">
                    <button class="arrow row-arrow row-prev" aria-label="Anterior"></button>
                    <div class="track"></div>
                    <button class="arrow row-arrow row-next" aria-label="Siguiente"></button>
                </div>
            </section>
            <section class="game-section">
                <div class="section-title">
                    <h2>Juegos populares</h2>
                </div>
                <div class="carousel">
                    <button class="arrow row-arrow row-prev" aria-label="Anterior"></button>
                    <div class="track"></div>
                    <button class="arrow row-arrow row-next" aria-label="Siguiente"></button>
                </div>
            </section>
        </main>
        <div id="site-footer"></div>
    </body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game.House | Registrarme</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/log-in.css">
    <link rel="stylesheet" href="css/site-links.css">
    <script type="module" src="js/form-validation.js"></script>
</head>

<body class="login">

    <main>
        <div class="c1">
            <div class="logo-c">

                <a href=" " id="logo">
                    <img src="img/Logo.svg" alt="inicio">
                </a>
                
            </div>

            <div class="c2">
                <div class="forms" id="ingreso">
                        
                    <p class="t1">Crea tu cuenta !</p>

                    <div class="inputs">
                        <form action="envio-correo.html" data-validate-required novalidate>
                            <label for="nombre">Nombre <span class="required-indicator" aria-hidden="true">*</span></label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" aria-describedby="nombre-error" required>
                            <span class="field-error" id="nombre-error" aria-live="polite" hidden></span>

                            <label for="username">Nombre de usuario</label>
                            <input type="text" id="username" name="username" placeholder="Nombre de ususario">

                            <label for="email">Correo electrónico <span class="required-indicator" aria-hidden="true">*</span></label>
                            <input type="email" id="email" name="email" placeholder="tuemail@gmail.com" aria-describedby="email-error" required>
                            <span class="field-error" id="email-error" aria-live="polite" hidden></span>

                            <label for="password">Contraseña <span class="required-indicator" aria-hidden="true">*</span></label>
                            <input type="password" id="password" name="password" placeholder="*********" aria-describedby="password-error" required>
                            <span class="field-error" id="password-error" aria-live="polite" hidden></span>

                            <label for="repeat-password">Repetir contraseña <span class="required-indicator" aria-hidden="true">*</span></label>
                            <input type="password" id="repeat-password" name="repeat-password" placeholder="*********" aria-describedby="repeat-password-error" data-matches="#password" required>
                            <span class="field-error" id="repeat-password-error" aria-live="polite" hidden></span>

                            <div class="terms-consent">
                                <label class="terms-consent__label" for="terms-accepted">
                                    <input class="terms-consent__checkbox" type="checkbox" id="terms-accepted" name="terms-accepted" value="accepted" aria-describedby="terms-error" data-required-message="Debés aceptar los términos y condiciones para registrarte." required>
                                    <span>Acepto los <a class="site-link" href=" ">términos y condiciones</a></span>
                                </label>
                                <span class="field-error" id="terms-error" aria-live="polite" hidden></span>
                            </div>

                            <p class="registration-success" role="status">&#10003; Registro realizado correctamente</p>

                            <!-- captcha -->
                            
                                <button class="amarillo" type="submit">REGISTRARME</button>

                        </form>
                    </div>

                    <p class="body">Ya tenes una cuenta? <a href="login.html"><span class="link">Inicia sesion</span></a></p>
                    
                </div>
            </div>

            <div class="c2">
                
            </div>
        </div>
    </main>

</body>
</html>

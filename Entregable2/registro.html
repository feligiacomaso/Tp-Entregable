<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game.House - Log in</title>

    <link rel="stylesheet" href="css/log-in.css">
</head>

<body class="login">

    <main>
        <div class="c1">
            <div class="logo-c">

                <a href="index.html" id="logo">
                    <img src="img/Logo.svg" alt="inicio">
                </a>
                
            </div>

            <div class="c2">
                <div class="forms" id="ingreso">
                        
                    <p class="t1">Crea tu cuenta !</p>

                    <div class="inputs">
                        <form>
                            <label for="nombre">Nombre <span style="color: red;">*</span></label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>

                            <label for="username">Nombre de usuario</label>
                            <input type="text" id="username" name="username" placeholder="Nombre de ususario">

                            <label for="email">Correo electrónico <span style="color: red;">*</span></label>
                            <input type="email" id="email" name="email" placeholder="Email" required>

                            <label for="password">Contraseña <span style="color: red;">*</span></label>
                            <input type="password" id="password" name="password" placeholder="1234" required>

                            <!-- captcha -->
                            
                            <!--<button type="submit">REGISTRARME</button>-->
                            <a href="envio-correo.html" class="forms">
                                <span class="social-text">REGISTRARME</span>
                            </a>

                        </form>
                    </div>

                    <p class="body">Ya tenes una cuenta? <a href="login.html"><span class="link">Inicia sesion</span></a></p>
                    
                </div>
            </div>

            <div class="c2">
                
            </div>
        </div>
    </main>

</body>
</html>

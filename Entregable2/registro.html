<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game.House | Registrarme</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/log-in.css">
    <script type="module" src="js/register.js"></script>
</head>

<body class="login">

    <main>
        <div class="c1">
            <div class="logo-c">

                <a href="index.html" id="logo">
                    <img src="img/Logo.svg" alt="inicio">
                </a>
                
            </div>

            <div class="c2">
                <div class="forms" id="ingreso">
                        
                    <p class="t1">Crea tu cuenta !</p>

                    <div class="inputs">
                        <form action="envio-correo.html">
                            <label for="nombre">Nombre <span style="color: red;">*</span></label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>

                            <label for="username">Nombre de usuario</label>
                            <input type="text" id="username" name="username" placeholder="Nombre de ususario">

                            <label for="email">Correo electrónico <span style="color: red;">*</span></label>
                            <input type="email" id="email" name="email" placeholder="tuemail@gmail.com" required>

                            <label for="password">Contraseña <span style="color: red;">*</span></label>
                            <input type="password" id="password" name="password" placeholder="*********" required>

                            <label for="repeat-password">Repetir contraseña <span style="color: red;">*</span></label>
                            <input type="password" id="repeat-password" name="repeat-password" placeholder="*********" required>

                            <!-- captcha -->
                            
                                <button class="amarillo" type="submit">REGISTRARME</button>
                            <!--<a href="envio-correo.html" class="forms">
                                <span class="social-text">REGISTRARME</span>
                            </a>-->

                        </form>
                    </div>

                    <p class="body">Ya tenes una cuenta? <a href="login.html"><span class="link">Inicia sesion</span></a></p>
                    
                </div>
            </div>

            <div class="c2">
                
            </div>
        </div>
    </main>

</body>
</html>
